spring:
  config:
    import: classpath:application-kafka.yml
  application:
    name: settlement-service
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: settlement-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: payments_user
    password: payments_pass

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

payment:
  processor:
    provider: ${PAYMENT_PROCESSOR_PROVIDER:mock}
    stripe:
      api-key: ${STRIPE_API_KEY:}
      default-payment-method: ${STRIPE_DEFAULT_PAYMENT_METHOD:pm_card_visa}
