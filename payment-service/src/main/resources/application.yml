spring:
  config:
    import: classpath:application-kafka.yml
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true

  jackson:
    use-jackson2-defaults: true

  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: payments_user
    password: payments_pass
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-service

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

payment:
  security:
    enabled: true
    api-key-header: X-Api-Key
  internal:
    token: ${INTERNAL_SERVICE_TOKEN:}
    header: X-Internal-Token
  rate-limit:
    enabled: true
    requests-per-minute: 120
  stripe:
    webhooks-enabled: ${STRIPE_WEBHOOKS_ENABLED:false}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  processor:
    provider: ${PAYMENT_PROCESSOR_PROVIDER:mock}
    stripe:
      api-key: ${STRIPE_API_KEY:}
      default-payment-method: ${STRIPE_DEFAULT_PAYMENT_METHOD:pm_card_visa}
  cleanup:
    idempotency-cron: "0 15 * * * *"
    saga-cron: "0 30 3 * * *"
    saga-retention-days: 30
  outbox:
    relay:
      # Disabilitare quando Debezium CDC è attivo (vedi docker-compose).
      enabled: ${PAYMENT_OUTBOX_RELAY_ENABLED:true}
      batch-size: 100
      fixed-delay-ms: 1000
    cdc-ack:
      enabled: ${PAYMENT_OUTBOX_CDC_ACK_ENABLED:false}
      fixed-delay-ms: 3000
      min-age-seconds: 2
  idempotency:
    ttl-hours: 24
  kafka:
    topics:
      events: payment.events

resilience4j:
  circuitbreaker:
    instances:
      payment-processor:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      payment-processor:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.3

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
  level:
    com.finance.payment: INFO
    org.springframework.kafka: WARN

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
