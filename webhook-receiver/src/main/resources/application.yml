spring:
  application:
    name: webhook-receiver

server:
  port: 8099

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

payment:
  internal:
    token: ${INTERNAL_SERVICE_TOKEN:}
    header: X-Internal-Token

logging:
  level:
    com.finance.payment: INFO
