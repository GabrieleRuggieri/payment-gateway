spring:
  config:
    import: classpath:application-kafka.yml
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: payments_user
    password: payments_pass

notification:
  webhook:
    default-url: http://localhost:8099/webhooks/payments
    force-default-url: false
    default-secret: whsec_demo_payment_gateway_local
    retry-delay-ms: 5000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
